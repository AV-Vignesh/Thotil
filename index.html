<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141019" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Thottil — our pregnancy companion</title>

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F5FA;--surface:#FFFFFF;--surface2:#EEEBF5;--ink:#241A3B;--muted:#6B6280;--line:#E2DEEC;
  --plum:#4B2E83;--plum-ink:#FFFFFF;--turmeric:#E3A21A;--lotus:#D9577F;--leaf:#2F8A62;--danger:#B42318;
  --fd:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fb:'Atkinson Hyperlegible',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141019;--surface:#1E1828;--surface2:#2A2236;--ink:#EEE9F7;--muted:#A79FB8;--line:#352C44;
  --plum:#B9A2F0;--plum-ink:#1B1326;--turmeric:#F2B53A;--lotus:#F07CA0;--leaf:#5FC495;--danger:#FF8A80;
  color-scheme:dark;
}}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:8px}
a{color:var(--plum)}

.top{position:sticky;top:0;z-index:6;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.brand{font:800 22px/1 var(--fd);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand small{font:400 13px var(--fb);color:var(--muted);letter-spacing:0}
.sos{background:var(--lotus);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px}
main{max-width:620px;margin:0 auto;padding:4px 16px 28px}

h1{font:800 clamp(28px,8vw,36px)/1.05 var(--fd);letter-spacing:-.03em}
h2{font:700 20px/1.2 var(--fd);letter-spacing:-.01em;margin-bottom:10px}
h3{font:700 16px/1.3 var(--fd)}
.muted{color:var(--muted)}
.small{font-size:14px}
p+p{margin-top:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.card.flat{background:var(--surface2);border-color:transparent}
.card.warn{border-color:var(--lotus);background:color-mix(in srgb,var(--lotus) 9%,var(--surface))}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* hero garland */
.hero{text-align:center;padding:6px 0 0;position:relative}
.garland{width:min(80vw,300px);height:auto;display:block;margin:0 auto}
.bead{fill:var(--surface);stroke:var(--line);stroke-width:2}
.bead.on{fill:var(--turmeric);stroke:var(--turmeric)}
.bead.tri{stroke:var(--plum)}
.bead.now{fill:var(--lotus);stroke:var(--lotus)}
@media (prefers-reduced-motion:no-preference){.bead.now{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes pulse{50%{transform:scale(1.45)}}
.hero-center{position:absolute;left:50%;top:calc(6px + min(40vw,150px));transform:translate(-50%,-50%);text-align:center;width:62%}
.big{font:800 clamp(56px,18vw,78px)/.9 var(--fd);letter-spacing:-.05em;color:var(--plum)}
.big-sub{font:700 15px var(--fd);margin-top:4px}
.hero-meta{display:flex;justify-content:center;gap:22px;margin-top:10px}
.hero-meta div{text-align:center}
.hero-meta b{display:block;font:700 20px var(--fd)}
.hero-meta span{font-size:13px;color:var(--muted)}

.size{display:flex;gap:14px;align-items:center}
.size .emo{font-size:46px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:var(--surface2);border-radius:18px;flex:none}

/* tasks */
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{font-weight:700;line-height:1.3}
.task .d{font-size:14px;color:var(--muted);margin-top:3px}
.task.done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--plum);border-radius:50%;display:grid;place-items:center;margin-top:1px;cursor:pointer;flex:none;background:var(--surface)}
.chk:checked{background:var(--leaf);border-color:var(--leaf)}
.chk:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:6px;margin-right:4px;background:var(--surface2);color:var(--muted)}
.tag.now{background:color-mix(in srgb,var(--turmeric) 22%,transparent);color:var(--ink)}
.tag.over{background:color-mix(in srgb,var(--lotus) 20%,transparent);color:var(--ink)}
.tag.cat{background:transparent;border:1px solid var(--line)}

.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .4s}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.chip.here{box-shadow:inset 0 -3px 0 var(--turmeric)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--plum);color:var(--plum-ink);font-weight:700;padding:12px 18px;border-radius:14px;min-height:46px;text-decoration:none}
.btn.block{width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.lotus{background:var(--lotus);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.link{color:var(--plum);font-weight:700;font-size:14px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick .qi{font-size:24px;line-height:1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .qi{font-size:26px}
.tile b{font:700 15px var(--fd)}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}

/* forms */
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
.field>em{display:block;font-size:13px;color:var(--muted);font-style:normal;margin-top:4px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:46px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--surface2);border:2px solid transparent}
.moods button.on{border-color:var(--plum);background:var(--surface)}
.toggle{display:inline-block;padding:7px 12px;margin:0 6px 6px 0;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700;background:var(--surface)}
.toggle.on{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}

/* journal */
.entry{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.entry img{width:100%;display:block;max-height:420px;object-fit:cover}
.entry .in{padding:14px 16px}
.entry .when{font:700 14px var(--fd);color:var(--muted)}
.entry .txt{white-space:pre-wrap;margin-top:6px}

/* lists */
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .r{text-align:right}
.pill{font-weight:700;font-family:var(--fd)}
.ok{color:var(--leaf)} .bad{color:var(--danger)}
.chart{width:100%;height:150px;display:block}
.chart .ln{fill:none;stroke:var(--plum);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--turmeric)}
.chart .gd{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--fb)}

.counter{width:min(64vw,240px);aspect-ratio:1;border-radius:50%;margin:10px auto 0;display:grid;place-items:center;background:var(--plum);color:var(--plum-ink);font:800 64px/1 var(--fd);border:10px solid color-mix(in srgb,var(--plum) 25%,var(--bg))}
.counter small{display:block;font:700 14px var(--fb);margin-top:6px;opacity:.85}
.counter:active{transform:scale(.97)}

.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--plum);padding:6px 0;margin-bottom:6px}
.scheme .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scheme dl{margin-top:8px;font-size:15px}
.scheme dt{font-weight:700;margin-top:8px}
.scheme dd{color:var(--ink)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.t td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
table.t td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:8px}
ul.b{padding-left:20px} ul.b li+li{margin-top:5px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--plum)}
.tabs button.on::before{content:"";position:absolute;top:-6px;width:8px;height:8px;border-radius:50%;background:var(--turmeric)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,12,30,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){.sheet.open .panel{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.empty .qi{font-size:40px;display:block;margin-bottom:6px}
.microw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.mic{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border-radius:999px;padding:10px 16px;font-weight:700;min-height:44px}
.mic.rec{background:var(--lotus);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.rec{animation:blink 1.2s ease-in-out infinite}}
@keyframes blink{50%{opacity:.7}}
.ai{margin-top:12px;padding:10px 12px;border-left:3px solid var(--plum);background:var(--surface2);border-radius:0 12px 12px 0}
.ai ul{padding-left:18px;margin-top:4px;font-size:14px}
pre.log{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45;background:var(--surface2);padding:10px;border-radius:12px;max-height:300px;overflow:auto;margin-top:10px}
details.dg{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
details.dg>summary{cursor:pointer;font-weight:700;list-style:none}
details.dg>summary::-webkit-details-marker{display:none}
.status{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line)}
.status.ok{background:var(--leaf)}.status.no{background:var(--lotus)}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">🌼 Thottil</div>
  <button class="sos" data-a="sos" aria-label="Emergency contacts and warning signs">Emergency</button>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs" aria-label="Main">
  <button data-a="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-a="tab" data-v="guide"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg>Guide</button>
  <button data-a="tab" data-v="tasks"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>To-do</button>
  <button data-a="tab" data-v="journal"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Journal</button>
  <button data-a="tab" data-v="more"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>More</button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

const $=s=>document.querySelector(s);

const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt=(d,o)=>d.toLocaleDateString("en-IN",o||{day:"numeric",month:"short",year:"numeric"});
const fmtS=d=>d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
const addM=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
const daysBetween=(a,b)=>Math.round((b-a)/DAY);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;

function preg(){
  const p=S.profile;
  let lmp=p.edd?addD(parse(p.edd),-280):parse(p.lmp);
  if(!lmp)return null;
  const days=daysBetween(lmp,today());
  const edd=addD(lmp,280);
  return {lmp,edd,days,week:Math.floor(days/7),day:((days%7)+7)%7,left:daysBetween(today(),edd)};
}
function babyAge(){const d=parse(S.profile.dob);if(!d)return null;const days=daysBetween(d,today());return {dob:d,days,week:Math.floor(days/7),day:days%7}}
// effective timeline week for tasks (continues past birth)
function gw(){const b=babyAge();if(b)return 40+b.days/7;const p=preg();return p?p.days/7:null}
function monthFor(w){if(w==null)return"m1";if(S.profile.dob){const b=babyAge();return b.days>42?"baby":"birth"}for(const m of MONTHS.slice(0,9))if(w<=m.wk[1]+.99)return m.id;return w<42?"m9":"birth"}
function allTasks(){return TASKS.concat(S.custom.map(c=>({id:c.id,m:c.m,t:c.t,d:c.d||"",s:null,e:null,cat:"custom"})))}
function status(t){
  if(S.tasks[t.id])return"done";
  const w=gw();
  if(t.s==null){const m=MONTHS.find(x=>x.id===t.m);if(!m||w==null)return"later";if(w>m.wk[1]+1)return"over";if(w>=m.wk[0]-1)return"now";return"later"}
  if(w==null)return"later";
  if(w>t.e+1)return"over";
  if(w>=t.s-1)return"now";
  return"later";
}

async function azureFetch(url,opts){
  let r;
  try{r=await fetch(url,opts)}catch(e){throw new Error("Couldn’t reach Azure. Check the endpoint, your internet, and that the resource allows public network access (browser calls can also be blocked by CORS).")}
  const txt=await r.text();
  if(!r.ok)throw new Error(explain(r.status,txt));
  try{return JSON.parse(txt)}catch(e){return {text:txt}}
}
async function aiChat(messages){

  if(c&&c.finish_reason==="content_filter")throw new Error("Azure’s content filter blocked this. Try rewording, or adjust the filter on the deployment.");
  return {text:(c&&c.message&&c.message.content)||"",model:d.model||AI.chat,usage:d.usage};
}
async function transcribe(blob){
  const ext=/mp4|m4a|aac/.test(blob.type)?"mp4":/ogg/.test(blob.type)?"ogg":/wav/.test(blob.type)?"wav":"webm";

  if(AI.style==="v1")fd.append("model",AI.stt);
  if(AI.lang!=="auto")fd.append("language",AI.lang.slice(0,2));
  const d=await azureFetch(sttURL(),{method:"POST",headers:{"api-key":AI.key},body:fd});
  return (d.text||"").trim();
}
function parseJSON(t){

async function runDigest(key){
  const p=preg();
  let entries,label;
  if(key==="last7"){const from=iso(addD(today(),-6));entries=S.journal.filter(j=>j.date>=from);label=`${fmtS(addD(today(),-6))} – ${fmtS(today())}`}
  else{const w=+key.slice(2);entries=S.journal.filter(j=>weekOn(j.date)===w);label=`Week ${w}`}
  if(!entries.length){toast("No entries in that period.");return}
  closeSheet();busy.add("digest");render();

    for(const j of [...entries].sort((a,b)=>a.date.localeCompare(b.date))){
      const line=`[${j.date}${weekOn(j.date)!=null?", week "+weekOn(j.date):""}] mood ${j.mood||"-"}; tags: ${(j.tags||[]).join(", ")||"-"}\n${(j.text||"(no notes)").slice(0,2500)}\n\n`;

const MIC={on:false,kind:null,rec:null,mr:null,stream:null,cancel:false,timer:null};
function micUI(state,msg){const b=$("#micBtn"),st=$("#micSt");if(b){b.classList.toggle("rec",state==="rec");b.textContent=state==="rec"?"■ Stop":"🎙️ Speak"}if(st)st.textContent=msg||""}
function appendText(t){const ta=$("#jText");if(!ta||!t)return;ta.value=(ta.value.trim()?ta.value.replace(/\s*$/," "):"")+t}
function startDevice(onText,onEnd){
  const r=new SR();r.lang=AI.lang==="auto"?"en-IN":AI.lang;r.continuous=true;r.interimResults=true;
  let finals="";r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)finals+=x[0].transcript+" ";else interim+=x[0].transcript}onText(finals,interim)};
  r.onerror=e=>{toast(e.error==="not-allowed"?"Microphone permission was denied. Allow it in the browser’s site settings.":e.error==="no-speech"?"Didn’t hear anything.":"Speech recognition error: "+e.error)};
  r.onend=()=>{MIC.on=false;MIC.rec=null;onEnd&&onEnd(finals.trim())};
  r.start();MIC.on=true;MIC.kind="device";MIC.rec=r;
}
async function startAzureRec(onBlob,maxSec){
  MIC.stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
  const mr=new MediaRecorder(MIC.stream,mime?{mimeType:mime}:undefined);const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{clearTimeout(MIC.timer);MIC.stream.getTracks().forEach(t=>t.stop());MIC.on=false;MIC.mr=null;const blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/webm"});if(!MIC.cancel)onBlob(blob);MIC.cancel=false};
  mr.start();MIC.on=true;MIC.kind="azure";MIC.mr=mr;MIC.cancel=false;
  MIC.timer=setTimeout(()=>{if(mr.state==="recording")mr.stop()},(maxSec||600)*1000);
}
function stopMic(cancel){if(!MIC.on)return;MIC.cancel=!!cancel;if(MIC.rec)MIC.rec.stop();if(MIC.mr&&MIC.mr.state==="recording")MIC.mr.stop()}
async function journalMic(){
  if(MIC.on){stopMic();return}
  const eng=voiceEngine();
  if(!eng){toast("Voice isn’t available in this browser. Use Chrome on Android, or set up Azure transcription.");return}
  try{
    if(eng==="device"){
      const ta=$("#jText");const base=ta.value.trim()?ta.value.replace(/\s*$/," "):"";
      startDevice((f,i)=>{const t=$("#jText");if(t)t.value=base+f+i},()=>micUI("idle",""));
      micUI("rec","Listening… tap Stop when done.");
    }else{
      await startAzureRec(async blob=>{
        micUI("busy","Transcribing…");
        try{const t=await transcribe(blob);if(t){appendText(t);micUI("idle","Added to notes.")}else micUI("idle","Didn’t catch any words.")}
        catch(e){micUI("idle","");toast(e.message)}
      });
      micUI("rec","Recording… tap Stop when done (max 10 min).");
    }
  }catch(e){micUI("idle","");toast(e&&e.name==="NotAllowedError"?"Microphone permission was denied. Allow it in the browser’s site settings.":"Couldn’t start the microphone.")}
}

function garland(filled,nowIdx){
  let s="";const cx=150,cy=150,r=126;
  for(let i=1;i<=40;i++){
    const a=(-90+(i-1)*9)*Math.PI/180,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    const tri=(i===14||i===28);
    let cls="bead"+(i<=filled?" on":"")+(i===nowIdx?" now":"")+(tri&&i>filled?" tri":"");
    s+=`<circle class="${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${tri?8:6.5}"/>`;
  }
  return `<svg class="garland" viewBox="0 0 300 300" role="img" aria-label="${filled} of 40 weeks">${s}</svg>`;
}

function chart(points,lbl){
  if(points.length<2)return"";
  const W=320,H=150,P=26;const ys=points.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<2){hi+=1;lo-=1}

  const d=points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="gd" x1="${P}" x2="${W}" y1="${y(hi)}" y2="${y(hi)}"/><line class="gd" x1="${P}" x2="${W}" y1="${y(lo)}" y2="${y(lo)}"/>
   <text x="0" y="${y(hi)+4}">${hi.toFixed(0)}</text><text x="0" y="${y(lo)+4}">${lo.toFixed(0)}</text>
   <path class="ln" d="${d}"/>${points.map((p,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(p.y)}" r="3.5"/>`).join("")}</svg>`;
}

   <table class="t">
    <tr><td>Pregnancy registered by 12 weeks</td><td>₹2,000</td></tr>
    <tr><td>Nutrition kit after month 3</td><td>₹2,000 kit</td></tr>
    <tr><td>After month 4</td><td>₹2,000</td></tr>
    <tr><td>Second nutrition kit</td><td>₹2,000 kit</td></tr>
    <tr><td>After delivery</td><td>₹4,000</td></tr>

    <tr><td>Baby’s MR vaccine (9–12 months)</td><td>₹2,000</td></tr></table>
   <div class="verdict">Honest read: the scheme targets poor families and is applied through the village/urban health nurse and PHC. A salaried IT household is very unlikely to qualify. Ask the UHN once — don’t plan money around it.</div></div>

  <div class="card scheme"><div class="hd"><h3>PMMVY (central scheme)</h3><span class="tag">Conditional</span></div>
   <dl><dt>What</dt><dd>₹5,000 for the first child in two instalments; ₹6,000 for a second child only if she is a girl. Apply up to 270 days after birth.</dd>

   <dl><dt>JSSK</dt><dd>Free delivery (normal and C-section), medicines, tests, food and transport at government facilities, plus free care for sick newborns.</dd>
   <dt>PMSMA</dt><dd>Free check-up by a specialist on the 9th of every month at government health facilities, for second- and third-trimester pregnancies.</dd></dl>
   <div class="verdict">Useful as a free second opinion even if you deliver privately.</div></div>

  <div class="card scheme"><div class="hd"><h3>Maternity leave (if she is employed)</h3><span class="tag now">Law</span></div>
   <dl><dt>Entitlement</dt><dd>26 weeks fully paid for the first two children; up to 8 of those weeks can be taken before the due date. Now under the Code on Social Security, 2020 (in force since 21 Nov 2025), which replaced the Maternity Benefit Act.</dd>
   <dt>Qualifying</dt><dd>At least 80 days actually worked in the 12 months before the expected delivery date.</dd>

function buyItems(){return BUY.map((b,i)=>({k:"b"+i,g:b[0],t:b[1],d:b[2],tag:b[3],w:b[4]})).concat(S.buyCustom.map(c=>({k:c.id,g:"Added by you",t:c.t,d:c.d||"",tag:c.tag||"must",w:0,custom:1})))}
function sBuy(){
  const all=buyItems(),f=S.buyF||"must";
  const need=all.filter(x=>x.tag==="must");const got=need.filter(x=>S.buy[x.k]).length;
  const wk=gw();
  const list=all.filter(x=>f==="all"?x.tag!=="skip":x.tag===f);
  const groups={};list.forEach(x=>{(groups[x.g]=groups[x.g]||[]).push(x)});
  let h=`<h1>Things to buy</h1>
   <div class="card"><div class="row between"><b>${got} of ${need.length} must-haves ready</b><span class="small muted">${need.length?Math.round(got/need.length*100):0}%</span></div><div class="bar" style="margin-top:8px"><i style="width:${need.length?got/need.length*100:0}%"></i></div>
   <p class="small muted" style="margin-top:8px">Aim to have every must-have by 36 weeks. Babies need far less than shops suggest — borrow or accept hand-me-downs for anything except the car seat and mattress.</p></div>
   <div class="seg" style="margin-top:14px">${[["must","Must"],["nice","Nice"],["later","Later"],["skip","Skip"],["all","All"]].map(([k,l])=>`<button class="${f===k?"on":""}" data-a="buyF" data-v="${k}">${l}</button>`).join("")}</div>`;
  if(f==="skip")h+=`<div class="card warn small" style="margin-top:14px">These get sold hard and gifted often. Some are useless; a few are actively unsafe. Politely redirect relatives who offer them.</div>`;
  Object.entries(groups).forEach(([g,items])=>{
    h+=`<div class="card"><h2>${esc(g)}</h2>${items.map(x=>{
      const due=x.w&&wk!=null&&!S.buy[x.k]&&x.tag==="must"&&wk>=x.w-2;
      return `<label class="task ${S.buy[x.k]?"done":""}">${x.tag==="skip"?`<span style="font-size:22px;width:26px;text-align:center">✕</span>`:`<input type="checkbox" class="chk" data-c="buy" data-v="${x.k}" ${S.buy[x.k]?"checked":""}>`}
       <div><div class="t">${esc(x.t)}</div>${x.d?`<div class="d">${esc(x.d)}</div>`:""}
       <div>${due?'<span class="tag over">Buy now</span>':""}${f==="all"?`<span class="tag cat">${BUYTAG[x.tag]}</span>`:""}${x.w&&x.tag!=="skip"&&x.w<=40?`<span class="tag">By week ${x.w}</span>`:""}${x.custom?`<button class="tag" data-a="buyDel" data-v="${x.k}">Delete</button>`:""}</div></div></label>`}).join("")}</div>`;
  });
  h+=`<div class="card"><h2>Add an item</h2><input type="text" id="buyNew" placeholder="e.g. Room-darkening curtains"><div class="row" style="margin-top:10px"><select id="buyTag" style="flex:1"><option value="must">Must have</option><option value="nice">Nice to have</option><option value="later">Can wait</option></select><button class="btn sm" data-a="buyAdd">Add</button></div></div>
   <button class="btn ghost block" style="margin-top:14px" data-a="buyShare">Share what we still need</button>
   <p class="small muted" style="margin-top:8px">Handy before Valaikappu — send relatives the list so gifts are useful.</p>`;
  return h;
}
function sSounds(){
  const p=preg(),b=babyAge(),w=p?p.week:null;
  let stage;
  if(b)stage="Your baby hears you clearly now and already knows your voices from the womb.";
  else if(w==null||w<18)stage="Hearing hasn’t started yet — the ears are still forming. Start the habit anyway; it’s for you as much as the baby.";
  else if(w<25)stage="The ears are working and the baby is starting to pick up sounds — mostly her heartbeat, digestion and her voice.";
  else stage="Baby now hears outside sounds, muffled, and reacts to familiar voices with movement. Your voices are being learned right now.";
  let h=`<h1>Sounds & bonding</h1><div class="card"><div class="muted small">${b?"Now":w!=null?`At ${w} weeks`:"Right now"}</div><p style="margin-top:6px;font-weight:700">${stage}</p></div>
  <div class="card"><h2>In the womb</h2><ul class="b">
   <li><b>Your voices matter most.</b> The mother’s voice reaches the baby from inside her body too. Newborns prefer the voices, songs and even stories they heard before birth.</li>
   <li><b>Music:</b> anything you both find calming — Tamil thalattu, carnatic or veena and flute instrumentals, devotional songs, whatever you love. Normal room volume from a speaker.</li>
   <li><b>No headphones on the belly.</b> Volume can’t be judged from outside, and the baby can’t move away from it.</li>
   <li><b>Avoid long exposure to very loud noise</b> — over roughly 85 dB, like concerts or close-range firecrackers.</li></ul></div>
  <div class="card"><h2>After birth</h2><ul class="b">
   <li><b>Talk all day.</b> Narrate what you’re doing, in Tamil, English, whatever you speak at home. Pause and let the baby “answer” with coos — this back-and-forth builds language.</li>
   <li><b>Sing the same lullaby</b> you used in pregnancy at sleep time.</li>
   <li><b>Read from day one.</b> Picture books, poems, even the newspaper aloud.</li>
   <li><b>White noise, if used:</b> keep it quiet (about shower-noise level), at least 2 metres from the cot, and not at full volume all night. Some machines are loud enough to harm hearing.</li>
   <li><b>No screens under 2 years</b> — no phone videos, rhymes channels or TV in the background. IAP and WHO both advise this; babies learn language from people, not screens.</li></ul></div>
  <div class="card"><h2>Hearing milestones</h2>
   <div class="li"><b>Birth</b><span class="small r">Newborn hearing screen before discharge or by 1 month</span></div>
   <div class="li"><b>0–3 months</b><span class="small r">Startles at loud sounds, calms to your voice</span></div>
   <div class="li"><b>4–6 months</b><span class="small r">Turns eyes or head towards sounds</span></div>
   <div class="li"><b>6–9 months</b><span class="small r">Babbles (“ba-ba”, “ma-ma”), responds to name</span></div>
   <div class="li"><b>12 months</b><span class="small r">First words, understands simple words</span></div>
   <p class="small muted" style="margin-top:8px">Missing any of these? Ask the paediatrician for a hearing test — early detection changes outcomes.</p></div>
  <div class="card"><h2>Bonding habits</h2>${BOND.map(([k,t,d,wk])=>`<label class="task ${S.bond[k]?"done":""}"><input type="checkbox" class="chk" data-c="bond" data-v="${k}" ${S.bond[k]?"checked":""}><div><div class="t">${t}</div><div class="d">${d}</div>${w!=null&&w>=wk-2&&!b&&!S.bond[k]?'<span class="tag now">Good time now</span>':""}</div></label>`).join("")}</div>
  <div class="card"><h2>Our songs</h2>
   ${S.songs.length?S.songs.map(x=>`<div class="li"><span>${esc(x.t)}${x.who?` <span class="small muted">${esc(x.who)}</span>`:""}</span><button class="link" data-a="songDel" data-v="${x.id}">✕</button></div>`).join(""):'<p class="small muted">The lullabies and songs you choose — so whoever is on night duty knows what works.</p>'}
   <input type="text" id="songT" placeholder="Song or lullaby" style="margin-top:10px"><div class="row" style="margin-top:8px"><input type="text" id="songW" placeholder="Who sings it (optional)" style="flex:1"><button class="btn sm" data-a="songAdd">Add</button></div></div>
  <div class="card flat small"><b>Honest note on myths:</b> playing Mozart or other “brain” music doesn’t make babies smarter — that claim didn’t hold up in research. Garbha sanskar practices are fine if they relax her, but don’t treat them as an IQ booster or a source of guilt. Calm parents and their voices are what count.</div>`;
  return h;
}
function sBag(){
  let total=0,done=0;
  const h=Object.entries(BAG).map(([g,items])=>`<div class="card"><h2>${g}</h2>${items.map(it=>{const k=g+"|"+it;total++;if(S.bag[k])done++;return `<label class="task ${S.bag[k]?"done":""}"><input type="checkbox" class="chk" data-c="bag" data-v="${esc(k)}" ${S.bag[k]?"checked":""}><div class="t" style="margin-top:2px">${esc(it)}</div></label>`}).join("")}</div>`).join("");
  return `<h1>Hospital bag</h1><div class="card"><div class="row between"><b>${done} of ${total} packed</b></div><div class="bar" style="margin-top:8px"><i style="width:${done/total*100}%"></i></div></div>${h}
   <div class="card flat small">Pack by 34–36 weeks. Many hospitals give a list too — check theirs and add anything missing here as a custom task.</div>`;
}
function sFood(){
  return `<h1>Food guide</h1>
  <div class="card"><h2>Eat more</h2><ul class="b">
   <li>Iron: ragi, keerai (spinach, murungai keerai), dates, jaggery, dal, eggs, chicken, mutton liver in moderation.</li>
   <li>Protein at every meal: dal, sundal, paneer, curd, eggs, fish, chicken.</li>
   <li>Calcium: milk, curd, buttermilk, ragi, sesame (ellu).</li>
   <li>Fibre for constipation: fruit, vegetables, whole grains, plenty of water.</li>
   <li>Small fish like sardine (mathi) and Indian mackerel (ayala) — omega-3, low mercury.</li></ul></div>
  <div class="card"><h2>Limit</h2><ul class="b">
   <li>Caffeine under about 200 mg a day — roughly two small cups of filter coffee, counting tea and cola.</li>
   <li>Sugar and fried snacks, especially if the OGTT is borderline.</li>
   <li>Extra calories: none needed in the first trimester; about 350 more a day in the second and 450 in the third — that’s a snack, not “eating for two”.</li></ul></div>
  <div class="card warn"><h2>Avoid</h2><ul class="b">
   <li>Alcohol, in any amount.</li>
   <li>Raw or undercooked meat, eggs and seafood.</li>
   <li>Unpasteurised milk and cheese made from it.</li>
   <li>Large predatory fish: shark, swordfish, king mackerel (high mercury).</li>
   <li>Raw or unripe papaya (the latex can trigger contractions). Ripe papaya in normal amounts is generally considered fine.</li>
   <li>Street food with uncertain water or hygiene — typhoid and hepatitis A are real risks.</li>
   <li>Herbal remedies and “heat/cold” home medicines without asking the doctor.</li></ul></div>`;
}
function sVax(){
  const b=babyAge();
  let h=`<h1>Baby vaccines</h1>`;
  if(!b)h+=`<div class="card flat small">Add the baby’s birth date in <button class="link" data-a="go" data-v="profile">Details</button> and the due date for each vaccine will appear here.</div>`;
  h+=`<div class="card">${VAX.map(v=>{let due="";if(b){const d=v.mo!=null?addM(b.dob,v.mo):addD(b.dob,v.d);const late=!S.vax[v.k]&&d<today();due=`<div class="small ${late?"bad":"muted"}">${late?"Due since ":"Due "}${fmt(d)}</div>`}
    return `<label class="task ${S.vax[v.k]?"done":""}"><input type="checkbox" class="chk" data-c="vax" data-v="${v.k}" ${S.vax[v.k]?"checked":""}><div><div class="t">${v.age}</div><div class="d">${v.list}</div>${due}</div></label>`}).join("")}</div>
   <div class="card flat small">This is the government (Universal Immunisation Programme) schedule — free at government centres. Private paediatricians usually follow the IAP schedule, which adds vaccines such as influenza, MMR, chickenpox, hepatitis A and typhoid. Ask yours for their chart and follow it.</div>`;
  return h;
}

function customSheet(m){
  openSheet(`<h2>Add your own task</h2>
   <label class="field"><span>Task</span><input type="text" id="cT" placeholder="e.g. Buy maternity pillow"></label>
   <label class="field"><span>Details (optional)</span><input type="text" id="cD"></label>
   <label class="field"><span>When</span><select id="cM">${MONTHS.map(x=>`<option value="${x.id}" ${x.id===m?"selected":""}>${x.name}</option>`).join("")}</select></label>
   <div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="customSave">Add task</button></div>`);
}

/* ================= ACTIONS ================= */
const A={
  tab(el){U.tab=el.dataset.v;U.sub=null;render(true)},
  go(el){closeSheet();U.tab="more";U.sub=el.dataset.v;render(true)},
  back(){U.sub=null;render(true)},
  close(){closeSheet()},
  month(el){U.month=el.dataset.v;render()},
  filter(el){U.filter=el.dataset.v;render()},
  sos(){openSheet(`<h2>Emergency</h2>${warnBody()}<div class="actions"><button class="btn ghost" data-a="close">Close</button></div>`)},
  welcomeSave(){
    const edd=val("w_edd"),lmp=val("w_lmp");
    if(!edd&&!lmp){toast("Enter the due date or the period date.");return}
    if(edd)S.profile.edd=edd;
    if(lmp){S.profile.lmp=lmp;if(!edd)S.profile.edd=iso(addD(parse(lmp),280))}
    const p=preg();if(p.days<0||p.days>301){toast("That date doesn’t look right — please check it.");delete S.profile.edd;delete S.profile.lmp;return}
    if(val("w_mom"))S.profile.mom=val("w_mom");
    save();render(true);toast("You’re all set.");
  },
  journalNew(){journalSheet(null)},
  journalEdit(el){journalSheet(S.journal.find(j=>j.id===el.dataset.v))},
  mood(el){U.draft.mood=U.draft.mood===el.dataset.v?"":el.dataset.v;el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===U.draft.mood))},
  jtag(el){const t=el.dataset.v;U.draft.tags.has(t)?U.draft.tags.delete(t):U.draft.tags.add(t);el.classList.toggle("on")},
  jPhotoDel(){U.draft.photo=null;$("#jPhotoBox").innerHTML="";toast("Photo removed")},
  journalSave(){
    const d=U.draft,text=val("jText");
    if(!text&&!d.mood&&!d.tags.size&&!d.photo){toast("Add a note, mood or photo first.");return}
    const old=S.journal.find(j=>j.id===d.id);
    const e={id:d.id||uid(),date:val("jDate")||iso(today()),mood:d.mood,tags:[...d.tags],text,photo:d.photo};
    if(old&&old.ai&&old.text===text){e.ai=old.ai}
    const i=S.journal.findIndex(j=>j.id===e.id);
    const prev=i>=0?S.journal[i]:null;
    if(i>=0)S.journal[i]=e;else S.journal.push(e);
    if(!save()){if(i>=0)S.journal[i]=prev;else S.journal.pop();return}
    closeSheet();U.tab="journal";U.sub=null;render(true);toast("Entry saved");
    if(AI.auto&&aiReady()&&text&&!e.ai)summarise(e.id,true);
  },
  journalDel(){if(!confirm("Delete this entry?"))return;S.journal=S.journal.filter(j=>j.id!==U.draft.id);save();closeSheet();render();toast("Entry deleted")},
  apptNew(){apptSheet(null)},
  apptEdit(el){apptSheet(S.appts.find(a=>a.id===el.dataset.v))},
  apptSave(el){
    const title=val("aTitle"),date=val("aDate");if(!title||!date){toast("Add what it is and the date.");return}
    const a={id:el.dataset.v||uid(),title,date,time:val("aTime"),where:val("aWhere"),q:val("aQ"),notes:val("aNotes")};
    const i=S.appts.findIndex(x=>x.id===a.id);if(i>=0)S.appts[i]=a;else S.appts.push(a);
    save();closeSheet();render();toast("Appointment saved");
  },
  apptDel(el){if(!confirm("Delete this appointment?"))return;S.appts=S.appts.filter(a=>a.id!==el.dataset.v);save();closeSheet();render();toast("Appointment deleted")},
  customNew(el){customSheet(el.dataset.v)},
  customSave(){const t=val("cT");if(!t){toast("Write the task first.");return}S.custom.push({id:"c_"+uid(),m:val("cM"),t,d:val("cD")});save();closeSheet();render();toast("Task added")},
  delCustom(el,e){e.preventDefault();if(!confirm("Delete this task?"))return;S.custom=S.custom.filter(c=>c.id!==el.dataset.v);delete S.tasks[el.dataset.v];save();render()},
  buyF(el){S.buyF=el.dataset.v;save();render()},
  buyAdd(){const t=val("buyNew");if(!t){toast("Type the item first.");return}S.buyCustom.push({id:"bc_"+uid(),t,tag:val("buyTag")});save();render();toast("Item added")},
  buyDel(el,e){e.preventDefault();S.buyCustom=S.buyCustom.filter(c=>c.id!==el.dataset.v);delete S.buy[el.dataset.v];save();render()},
  buyShare(){
    const need=buyItems().filter(x=>(x.tag==="must"||x.tag==="nice")&&!S.buy[x.k]);
    if(!need.length){toast("Nothing left to buy.");return}
    const text="Baby things we still need:\n"+need.map(x=>`• ${x.t}`).join("\n");
    if(navigator.share)navigator.share({title:"Baby list",text}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("List copied")).catch(()=>toast("Couldn’t copy the list"));
  },
  songAdd(){const t=val("songT");if(!t){toast("Type a song first.");return}S.songs.push({id:uid(),t,who:val("songW")});save();render()},
  songDel(el){S.songs=S.songs.filter(x=>x.id!==el.dataset.v);save();render()},
  mic(){journalMic()},
  aiSum(el){summarise(el.dataset.v)},
  digestNew(){
    const weeks=[...new Set(S.journal.map(j=>weekOn(j.date)).filter(w=>w!=null))].sort((a,b)=>b-a);
    openSheet(`<h2>Summarise</h2><p class="small muted">The AI reads all entries in the period you pick.</p>
     <div style="margin-top:12px"><button class="toggle" data-a="digestRun" data-v="last7">Last 7 days</button>${weeks.map(w=>`<button class="toggle" data-a="digestRun" data-v="w:${w}">Week ${w}</button>`).join("")}</div>
     <div class="actions"><button class="btn ghost" data-a="close">Cancel</button></div>`)},
  digestRun(el){runDigest(el.dataset.v)},
  digestDel(el){if(!confirm("Delete this summary?"))return;S.digests=S.digests.filter(d=>d.id!==el.dataset.v);save();render()},
  aiQ(el){
    const [t,id]=el.dataset.v.split(":");let qs=[],src=null;
    if(t==="j"){src=S.journal.find(j=>j.id===id);qs=src&&src.ai?src.ai.questions:[]}else{src=S.digests.find(d=>d.id===id);qs=src?src.questions:[]}
    if(!qs.length)return;
    const nx=S.appts.filter(a=>a.date>=iso(today())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
    const add=qs.map(q=>"• "+q).join("\n");
    if(nx){nx.q=(nx.q?nx.q+"\n":"")+add;if(t==="j")src.ai.qAdded=1;save();render();toast(`Added to ${nx.title}`)}
    else{apptSheet(null);const q=$("#aQ");if(q)q.value=add;toast("No visit booked yet — add one to keep these questions.")}
  },
  aiTodo(el){const j=S.journal.find(x=>x.id===el.dataset.v);if(!j||!j.ai)return;const m=monthFor(gw());j.ai.todos.forEach(t=>S.custom.push({id:"c_"+uid(),m,t,d:"From journal"}));j.ai.tAdded=1;save();render();toast(`${plural(j.ai.todos.length,"task")} added`)},
  pinOk(){if(val("pinIn")===AI.pin){U.adminOk=true;render()}else toast("Wrong PIN")},
  aiShowKey(){const k=$("#ai_key");if(k)k.type=k.type==="password"?"text":"password"},
  aiSave(){
    let ep=val("ai_endpoint");
    if(ep){try{const u=new URL(ep.startsWith("http")?ep:"https://"+ep);if(u.protocol!=="https:")throw 0;ep=u.origin}catch(e){toast("Endpoint must be a valid https URL.");return}}
    Object.assign(AI,{style:val("ai_style"),endpoint:ep,key:val("ai_key"),chat:val("ai_chat"),chatVer:val("ai_chatVer")||AIDEF.chatVer,voice:val("ai_voice"),stt:val("ai_stt"),sttVer:val("ai_sttVer")||AIDEF.sttVer,lang:val("ai_lang"),auto:$("#ai_auto").checked,pin:val("ai_pin")});
    if(AI.pin)U.adminOk=true;
    saveAI();log("Settings saved.");render();toast("Settings saved");
  },
  async aiTestChat(){
    if(!aiReady()){log("✗ Fill endpoint, key and chat deployment, then Save.");return}
    log(`→ POST ${chatURL()}`);const t0=performance.now();
    try{const r=await aiChat([{role:"user",content:"Reply with exactly: OK, Thottil is connected."}]);
      log(`✓ ${Math.round(performance.now()-t0)} ms, model ${r.model}${r.usage?`, ${r.usage.total_tokens} tokens`:""}\n  Reply: ${r.text}`)}
    catch(e){log("✗ "+e.message)}
  },
  async aiTestSum(){
    if(!aiReady()){log("✗ Set up chat first.");return}
    log("→ Summarising a sample entry…");
    try{const r=await aiChat([{role:"system",content:SYS_ENTRY()},{role:"user",content:"Date: "+iso(today())+"\nPregnancy week: 20\n\nEntry:\nRomba tired today, back pain after office. Felt baby kick for the first time in the evening, both of us were so happy! Need to book the anomaly scan and ask doctor if the itching on my belly is normal. Also need to buy maternity bras."}]);
      log("✓ Raw reply:\n"+r.text);const o=parseJSON(r.text);log(o.summary&&Array.isArray(o.todos)?"✓ Parsed as JSON — summaries will work.":"! Reply wasn’t clean JSON. Summaries will still save the text, but try a newer model.")}
    catch(e){log("✗ "+e.message)}
  },
  async aiTestStt(){
    if(!sttReady()){log("✗ Fill the transcription deployment and Save. "+(canRecord?"":"This browser can’t record audio."));return}
    if(MIC.on){log("Already recording.");return}
    try{await startAzureRec(async blob=>{log(`→ Recorded ${(blob.size/1024).toFixed(0)} KB (${blob.type||"unknown type"}). Sending to ${sttURL()}`);
        const t0=performance.now();try{const t=await transcribe(blob);log(`✓ ${Math.round(performance.now()-t0)} ms\n  Heard: ${t||"(nothing)"}`)}catch(e){log("✗ "+e.message)}},5);
      log("● Recording for 5 seconds — say something…")}
    catch(e){log("✗ Microphone: "+(e.name==="NotAllowedError"?"permission denied":e.message))}
  },
  aiTestDev(){
    if(!SR){log("✗ This browser has no speech recognition. Chrome on Android works; on iPhone use Safari.");return}
    if(MIC.on){log("Already listening.");return}
    try{startDevice((f,i)=>{},t=>log(t?`✓ Heard: ${t}`:"! Heard nothing."));log(`● Listening (${AI.lang==="auto"?"en-IN":AI.lang}) for 6 seconds…`);setTimeout(()=>stopMic(),6000)}
    catch(e){log("✗ "+e.message)}
  },
  medAdd(){const v=val("medNew");if(!v)return;if(!S.meds.list.includes(v))S.meds.list.push(v);save();render()},
  medDel(el){S.meds.list.splice(+el.dataset.v,1);save();render()},
  wAdd(){const kg=parseFloat(val("wKg"));if(!kg||kg<30||kg>200){toast("Enter weight in kg.");return}S.weights.push({id:uid(),date:val("wDate")||iso(today()),kg:Math.round(kg*10)/10});save();render();toast("Weight saved")},
  wDel(el){S.weights=S.weights.filter(w=>w.id!==el.dataset.v);save();render()},
  bAdd(){const s=parseInt(val("bSys")),d=parseInt(val("bDia"));if(!s||!d||s<60||s>250||d<30||d>160){toast("Enter both numbers, e.g. 118 and 76.");return}
    S.bp.push({id:uid(),date:val("bDate")||iso(today()),sys:s,dia:d});save();render();const f=bpFlag(s,d);toast(f[1])},
  bDel(el){S.bp=S.bp.filter(b=>b.id!==el.dataset.v);save();render()},
  kickStart(){S.kickLive={start:Date.now(),count:0};save();render()},
  kick(){S.kickLive.count++;save();if(navigator.vibrate)navigator.vibrate(30);render();if(S.kickLive.count===10)toast("10 movements — well done, little one.")},
  kickUndo(){if(S.kickLive.count>0)S.kickLive.count--;save();render()},
  kickStop(){const L=S.kickLive;if(L.count>0)S.kicks.push({start:L.start,end:Date.now(),count:L.count});S.kickLive=null;save();render();toast("Session saved")},
  contr(){const C=S.contr;if(C.length&&!C[C.length-1].e)C[C.length-1].e=Date.now();else C.push({s:Date.now(),e:null});if(C.length>60)C.splice(0,C.length-60);save();if(navigator.vibrate)navigator.vibrate(40);render()},
  contrClear(){if(!confirm("Clear all timed contractions?"))return;S.contr=[];save();render()},
  profileSave(){
    const ids=["edd","lmp","dob","mom","dad","blood","height","preWeight","doctor","doctorPhone","hospital","hospitalPhone","paed","picme","insurer","policy"];
    const oldEdd=S.profile.edd,oldLmp=S.profile.lmp;
    ids.forEach(k=>{const v=val("p_"+k);if(v)S.profile[k]=v;else delete S.profile[k]});
    if(S.profile.lmp&&S.profile.lmp!==oldLmp&&S.profile.edd===oldEdd)S.profile.edd=iso(addD(parse(S.profile.lmp),280));
    save();render();toast("Details saved");
  },
  export(){
    const name=`thottil-backup-${iso(today())}.json`;
    const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
    const done=()=>{S.lastBackup=iso(today());save();render()};
    const dl=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);done();toast("Backup downloaded")};
    try{const file=new File([blob],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Thottil backup"}).then(()=>{done();toast("Backup shared")}).catch(err=>{if(err&&err.name!=="AbortError")dl()});return}}catch(e){}
    dl();
  },
  import(){$("#importFile").click()},
  reset(){if(!confirm("Delete ALL data on this phone? This cannot be undone."))return;if(!confirm("Last check — have you exported a backup?"))return;S=clone(DEF);save();U.sub=null;U.tab="home";render(true);toast("All data deleted")}
};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const f=A[el.dataset.a];if(f){if(el.tagName==="BUTTON")e.preventDefault();f(el,e)}
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.c){
    const k=el.dataset.v;
    if(el.dataset.c==="task"){if(el.checked)S.tasks[k]=iso(today());else delete S.tasks[k]}
    else if(el.dataset.c==="med"){const t=iso(today());const l=S.meds.log[t]=S.meds.log[t]||[];if(el.checked){if(!l.includes(k))l.push(k)}else S.meds.log[t]=l.filter(x=>x!==k)}
    else if(el.dataset.c==="bag"){if(el.checked)S.bag[k]=1;else delete S.bag[k]}
    else if(el.dataset.c==="buy"){if(el.checked)S.buy[k]=iso(today());else delete S.buy[k]}
    else if(el.dataset.c==="bond"){if(el.checked)S.bond[k]=iso(today());else delete S.bond[k]}
    else if(el.dataset.c==="vax"){if(el.checked)S.vax[k]=iso(today());else delete S.vax[k]}
    save();
    if(el.dataset.c==="task"&&el.checked&&navigator.vibrate)navigator.vibrate(20);
    setTimeout(render,el.checked?250:0);
    return;
  }
  if(el.id==="micLang"){AI.lang=el.value;saveAI();return}
  if(el.id==="jPhoto"&&el.files[0]){
    try{U.draft.photo=await compress(el.files[0]);$("#jPhotoBox").innerHTML=`<img src="${U.draft.photo}" style="width:100%;border-radius:14px" alt="">`}
    catch(err){toast("Couldn’t read that photo. Try a JPG or PNG.")}
  }
  if(el.id==="importFile"&&el.files[0]){
    try{const data=JSON.parse(await el.files[0].text());
      if(typeof data!=="object"||!data||!("profile"in data)){toast("That file isn’t a Thottil backup.");return}
      if(!confirm("Replace the data on this phone with this backup?"))return;
      S=Object.assign(clone(DEF),data);save();U.tab="home";U.sub=null;render(true);toast("Backup restored")}
    catch(err){toast("Couldn’t read that file.")}
    el.value="";
  }
});
function compress(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=720,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.7))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
window.addEventListener("scroll",()=>$("#top").classList.toggle("scrolled",scrollY>4),{passive:true});
// refresh live timers & day rollover
setInterval(()=>{if(!$("#sheet").classList.contains("open")&&U.tab==="more"&&(U.sub==="kicks"||U.sub==="contr"))render()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#sheet").classList.contains("open"))render()});

if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render(true);
</script>
